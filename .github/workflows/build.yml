name: build
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write          # needed only for publishing releases on v* tags
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: MacKernelSDK
        run: git clone --depth 1 https://github.com/acidanthera/MacKernelSDK
      - name: Lilu plugin headers
        run: |
          git clone --depth 1 --branch 1.7.2 https://github.com/acidanthera/Lilu /tmp/Lilu-src
          mkdir -p Lilu.kext/Contents/Resources
          cp -R /tmp/Lilu-src/Lilu/Headers /tmp/Lilu-src/Lilu/Library Lilu.kext/Contents/Resources/
          mkdir -p Lilu.kext/Contents/Resources/Headers
          if [ -f "kext/TGLDmic/Headers/hde64.h" ]; then
            cp kext/TGLDmic/Headers/hde64.h Lilu.kext/Contents/Resources/Headers/hde64.h
          else
            cat << 'EOF' > Lilu.kext/Contents/Resources/Headers/hde64.h
          #ifndef _HDE64_H_
          #define _HDE64_H_
          #include <stdint.h>
          #pragma pack(push,1)
          typedef struct {
              uint8_t len;
              uint8_t p_rep, p_lock, p_seg, p_66, p_67;
              uint8_t rex, rex_rn, rex_b, rex_x, rex_r, rex_w;
              uint8_t opcode, opcode2;
              uint8_t modrm, modrm_mod, modrm_reg, modrm_rm;
              uint8_t sib, sib_scale, sib_index, sib_base;
              union { uint8_t d8; uint16_t d16; uint32_t d32; } disp;
              union { uint8_t i8; uint16_t i16; uint32_t i32; uint64_t i64; } imm;
              uint32_t flags;
          } hde64s;
          #pragma pack(pop)
          #ifdef __cplusplus
          extern "C" {
          #endif
          unsigned int hde64_disasm(const void *code, hde64s *hs);
          #ifdef __cplusplus
          }
          #endif
          #endif
          EOF
          fi
          test -f Lilu.kext/Contents/Resources/Headers/hde64.h
          test -f Lilu.kext/Contents/Resources/Headers/kern_api.hpp
          test -f Lilu.kext/Contents/Resources/Library/plugin_start.cpp
      - name: Build kext
        run: make -C kext SDK=$GITHUB_WORKSPACE/MacKernelSDK
      - name: Check bundles
        run: |
          file kext/build/TGLDmic.kext/Contents/MacOS/TGLDmic
          plutil -lint kext/build/TGLDmic.kext/Contents/Info.plist
          nm kext/build/TGLDmic.kext/Contents/MacOS/TGLDmic | grep -c _TGLDmic_kern_start

      - name: Version
        id: ver
        run: echo "v=$(plutil -extract CFBundleShortVersionString raw kext/TGLDmic/Info.plist)" >> "$GITHUB_OUTPUT"

      - name: Kext zip
        run: |
          D=dist/TGLDmic-${{ steps.ver.outputs.v }}-kext
          mkdir -p $D
          cp -R kext/build/TGLDmic.kext $D/
          cp tools/list-audio-devices.py tools/snapshot-to-wav.py tools/diff-regs.py $D/
          cp docs/KEXT-README.md $D/README.md
          cp docs/INSTALL.md $D/INSTALL.md
          cp LICENSE $D/LICENSE
          cp firmware/LICENCE.Intel $D/LICENCE.Intel   # embedded SOF firmware licence
          (cd dist && ditto -c -k --keepParent TGLDmic-${{ steps.ver.outputs.v }}-kext TGLDmic-${{ steps.ver.outputs.v }}-kext.zip)

      - uses: actions/upload-artifact@v4
        with:
          name: TGLDmic-${{ steps.ver.outputs.v }}-kext
          path: dist/TGLDmic-${{ steps.ver.outputs.v }}-kext.zip

      - name: GitHub Release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TGLDmic-${{ steps.ver.outputs.v }}-kext.zip
